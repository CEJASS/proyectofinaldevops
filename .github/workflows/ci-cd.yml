name: CI/CD Pipeline - Hola Mundo Flask

on:
  push:
      branches:
            - main
              pull_request:
                  branches:
                        - main

                        env:
                          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/hola-mundo-flask

                          jobs:
                            test:
                                name: Instalar dependencias y ejecutar pruebas
                                    runs-on: ubuntu-latest

                                        steps:
                                              - name: Clonar repositorio
                                                      uses: actions/checkout@v4

                                                            - name: Configurar Python 3.11
                                                                    uses: actions/setup-python@v5
                                                                            with:
                                                                                      python-version: "3.11"

                                                                                            - name: Instalar dependencias
                                                                                                    run: |
                                                                                                              python -m pip install --upgrade pip
                                                                                                                        pip install -r requirements.txt
                                                                                                                        
                                                                                                                              - name: Ejecutar pruebas unitarias
                                                                                                                                      run: pytest test_app.py -v
                                                                                                                                      
                                                                                                                                        docker:
                                                                                                                                            name: Build y Push imagen a Docker Hub
                                                                                                                                                runs-on: ubuntu-latest
                                                                                                                                                    needs: test
                                                                                                                                                    
                                                                                                                                                        steps:
                                                                                                                                                              - name: Clonar repositorio
                                                                                                                                                                      uses: actions/checkout@v4
                                                                                                                                                                      
                                                                                                                                                                            - name: Iniciar sesion en Docker Hub
                                                                                                                                                                                    uses: docker/login-action@v3
                                                                                                                                                                                            with:
                                                                                                                                                                                                      username: ${{ secrets.DOCKER_USERNAME }}
                                                                                                                                                                                                                password: ${{ secrets.DOCKER_PASSWORD }}
                                                                                                                                                                                                                
                                                                                                                                                                                                                      - name: Configurar Docker Buildx
                                                                                                                                                                                                                              uses: docker/setup-buildx-action@v3
                                                                                                                                                                                                                              
                                                                                                                                                                                                                                    - name: Build y Push imagen
                                                                                                                                                                                                                                            uses: docker/build-push-action@v5
                                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                                              context: .
                                                                                                                                                                                                                                                                        push: true
                                                                                                                                                                                                                                                                                  tags: |
                                                                                                                                                                                                                                                                                              ${{ env.DOCKER_IMAGE }}:latest
                                                                                                                                                                                                                                                                                                          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                            deploy:
                                                                                                                                                                                                                                                                                                                name: Publicar en produccion (Render)
                                                                                                                                                                                                                                                                                                                    runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                        needs: docker
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                            steps:
                                                                                                                                                                                                                                                                                                                                  - name: Trigger deploy en Render
                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                    curl -s -X POST \
                                                                                                                                                                                                                                                                                                                                                                "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
                                                                                                                                                                                                                                                                                                                                                                            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                                                                                                                                                                                                                                                                                                                                                                                        -H "Content-Type: application/json" \
                                                                                                                                                                                                                                                                                                                                                                                                    -d '{"clearCache": false}' \
                                                                                                                                                                                                                                                                                                                                                                                                                | jq .
                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Confirmar deploy iniciado
                                                                                                                                                                                                                                                                                                                                                                                                                              run: echo "Deploy enviado a Render."
